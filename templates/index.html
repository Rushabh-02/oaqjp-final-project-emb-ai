
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    >
    <style>
        .center-heading {
            text-align: center;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="center-heading">NLP - Emotion Detection</h1>

                <form method="POST" action="/">
                    <div class="form-group mt-4">
                        <label for="textToAnalyze">
                            Please enter the text to be analyzed
                        </label>
                        <textarea
                            class="form-control"
                            id="textToAnalyze"
                            name="textToAnalyze"
                            rows="4"
                        >{{ text_to_analyze }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Run Emotion Detection
                    </button>
                </form>

                {% if error_message %}
                    <div class="alert alert-warning mt-4">
                        {{ error_message }}
                    </div>
                {% endif %}

                {% if result %}
                    <div class="result-box">
                        <h2>Result of Emotion Detection</h2>
                        {% for emotion, score in result.items() %}
                            <p>
                                <strong>{{ emotion.replace('_', ' ').title() }}:</strong>
                                {{ score }}
                            </p>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
